<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>SITEWISE · Site photo</title>
<!-- Served by the backend at /m (QR code target). Restyled to match the app; logic unchanged:
     the capture time is recorded by this page (time_source=in_app_capture), not taken from file metadata. -->
<style>
  :root { --bg:#0A1120; --surface:#111B2E; --line:#22314C; --ink:#E8EDF5; --ink-2:#B4BFD0; --ink-3:#8A97AD; --accent:#6A9CFF; --accent-ink:#07101F;
          --ok:#2ECC71; --unc:#F1C40F; --bad:#E74C3C; --none:#9AA5AE; --brand:#8A1538; color-scheme: dark; }
  @media (prefers-color-scheme: light) { :root { --bg:#F3F5F9; --surface:#fff; --line:#DEE3EC; --ink:#0E1A2D; --ink-2:#3E4B61; --ink-3:#5A6779; --accent:#1F55C8; --accent-ink:#fff; color-scheme: light; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         padding: max(20px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); }
  .wrap { max-width: 460px; margin: 0 auto; display: grid; gap: 18px; }
  header { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .14em; font-size: .95rem; }
  .mark { width: 26px; height: 26px; border-radius: 7px; background: var(--brand); }
  .sample { font-size: .7rem; font-weight: 700; letter-spacing: .08em; padding: 3px 8px; border-radius: 6px; color: #1D1600; background: var(--unc); }
  h1 { font-size: 1.5rem; font-weight: 600; margin: 4px 0 0; letter-spacing: -.01em; }
  p { margin: 0; color: var(--ink-2); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; }
  label { display: grid; gap: 6px; font-size: .88rem; font-weight: 500; color: var(--ink-2); }
  select { height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 0 12px; font: inherit; }
  .shot { display: grid; place-items: center; gap: 8px; min-height: 180px; border: 1.5px dashed var(--line); border-radius: 12px; color: var(--ink-2); cursor: pointer; overflow: hidden; position: relative; }
  .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .shot svg { width: 34px; height: 34px; fill: none; stroke: currentColor; stroke-width: 1.6; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
  button { height: 52px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font: 600 1rem/1 system-ui, sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
  button[disabled] { opacity: .55; }
  .spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid currentColor; border-right-color: transparent; animation: s .7s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  .result { display: none; gap: 10px; }
  .result.show { display: grid; animation: up .4s cubic-bezier(.16,1,.3,1); }
  @keyframes up { from { opacity: 0; transform: translateY(8px); } }
  .row { display: flex; justify-content: space-between; gap: 12px; font-size: .92rem; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row > span:first-child { color: var(--ink-3); flex: none; }
  .row > :last-child { text-align: right; }
  .warn { background: color-mix(in srgb, var(--unc) 16%, transparent); color: var(--ink); padding: 8px 10px; border-radius: 8px; font-size: .88rem; }
  .err { color: var(--ink); background: color-mix(in srgb, var(--bad) 14%, transparent); padding: 10px 12px; border-radius: 10px; font-size: .9rem; display: none; }
  .err.show { display: block; }
  .foot { font-size: .8rem; color: var(--ink-3); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header><span class="brand"><span class="mark"></span>SITEWISE</span><span class="sample">SAMPLE DATA</span></header>
  <div><h1>Site photo</h1><p>The capture time is recorded by this page, not taken from file metadata. The AI checks the photo; an engineer decides.</p></div>
  <div class="card">
    <label>Element<select id="el"><option>Loading…</option></select></label>
    <label class="shot" id="shot">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <span>Tap to take a photo</span>
      <input id="ph" type="file" accept="image/*" capture="environment">
    </label>
    <button id="go" disabled>Submit evidence</button>
    <div class="err" id="err" role="alert"></div>
  </div>
  <div class="card result" id="out" aria-live="polite"></div>
  <p class="foot">AI observes · evidence supports · engineer certifies</p>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let file = null;
fetch("/api/elements").then(r => r.json()).then(es => {
  $("el").innerHTML = es.map(e => `<option value="${esc(e.element_id)}" ${e.element_id === "D-103" ? "selected" : ""}>${esc(e.element_id)} - ${esc(e.name)}</option>`).join("");
}).catch(() => { $("err").textContent = "Can't reach SITEWISE. Check you're on the same wifi as the demo laptop."; $("err").classList.add("show"); });
$("ph").addEventListener("change", e => {
  file = e.target.files[0] || null;
  $("go").disabled = !file;
  const old = $("shot").querySelector("img"); if (old) old.remove();
  if (file) { const img = new Image(); img.src = URL.createObjectURL(file); img.alt = "Selected photo"; $("shot").appendChild(img); }
});
$("go").addEventListener("click", async () => {
  if (!file) { $("err").textContent = "Pick a photo first"; $("err").classList.add("show"); return; }
  $("err").classList.remove("show"); $("out").classList.remove("show");
  const fd = new FormData(); fd.append("file", file); fd.append("element_id", $("el").value);
  const now = new Date(); const local = new Date(now - now.getTimezoneOffset() * 6e4).toISOString().slice(0, 19);
  fd.append("capture_time", local); fd.append("time_source", "in_app_capture"); fd.append("uploader", "mobile");
  $("go").disabled = true; $("go").innerHTML = '<span class="spin"></span>Analyzing with Hugging Face models…';
  try {
    const r = await fetch("/api/evidence", { method: "POST", body: fd }); const j = await r.json();
    if (!r.ok) throw new Error(typeof j.detail === "string" ? j.detail : JSON.stringify(j));
    const a = j.ai || {};
    let h = `<div class="row"><span>Evidence</span><b>${esc(j.evidence_id)}</b></div>`;
    h += a.error ? `<div class="warn">AI unavailable. Sent to the engineer for review.</div>`
      : `<div class="row"><span>AI sees</span><b>${esc(a.final_label)}</b></div>
         <div class="row"><span>Stage</span><span>${a.escalation_model_id ? "Escalated to VLM" : "Small model"}</span></div>`;
    if (a.vlm && a.vlm.reason) h += `<div class="row"><span>Reason</span><span>${esc(a.vlm.reason)}</span></div>`;
    if (!a.error) h += `<div class="row"><span>Matches element</span><span>${a.matches_declared_element ? "Yes" : "No"}</span></div>`;
    if (j.duplicates && j.duplicates.length) h += `<div class="warn">Possible reuse of ${esc(j.duplicates[0].evidence_id)} (${esc(j.duplicates[0].kind)}). Review needed.</div>`;
    (j.flags || []).forEach(f => h += `<div class="warn">${esc(f.message)}</div>`);
    h += `<p>Sent to engineer for review. AI does not certify work.</p>`;
    $("out").innerHTML = h; $("out").classList.add("show");
  } catch (e) {
    $("err").textContent = "Upload failed: " + e.message; $("err").classList.add("show");
  } finally { $("go").disabled = !file; $("go").textContent = "Submit evidence"; }
});
</script>
</body>
</html>
