    <title>SITEWISE</title>
    <script>
      // Apply the saved theme before first paint (no flash).
      try { var t = localStorage.getItem("sw-theme") || "system";
        var d = t === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : t;
        document.documentElement.dataset.theme = d; } catch (e) { document.documentElement.dataset.theme = "dark"; }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
